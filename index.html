<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff1bf" />
  <title>Block Operations Tool</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🧱</div>
        <div>
          <h1 data-i18n="title">一起来探索积木加减！</h1>
          <p data-i18n="subtitle">用位值积木看见加法、减法与换位。</p>
        </div>
      </div>
      <div class="language-switch" aria-label="Language">
        <button type="button" data-lang="bm">BM</button>
        <button type="button" data-lang="zh" class="active">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <nav class="operation-tabs" aria-label="Operation">
      <button type="button" class="operation-tab active" data-operation="addition">
        <span aria-hidden="true">＋</span><span data-i18n="addition">加法</span>
      </button>
      <button type="button" class="operation-tab" data-operation="subtraction">
        <span aria-hidden="true">−</span><span data-i18n="subtraction">减法</span>
      </button>
    </nav>

    <main class="tool-layout">
      <aside class="settings-card">
        <div class="eyebrow" data-i18n="teacherSetup">老师设置</div>
        <h2 data-i18n="manualNumbers">手动输入数字</h2>
        <div class="rule"></div>

        <label class="field">
          <span data-i18n="firstNumber">第一个数</span>
          <input id="numberA" type="text" inputmode="numeric" autocomplete="off" value="28" />
        </label>

        <label class="field">
          <span data-i18n="secondNumber">第二个数</span>
          <input id="numberB" type="text" inputmode="numeric" autocomplete="off" value="6" />
        </label>

        <p id="inputError" class="input-error" role="alert" hidden></p>

        <button id="buildBtn" class="primary-button" type="button">
          <span aria-hidden="true">🧱</span><span data-i18n="build">更换数字</span>
        </button>
        <button id="resetBtn" class="secondary-button" type="button">
          <span aria-hidden="true">↻</span><span data-i18n="reset">重置工具</span>
        </button>

        <div class="curriculum-note">
          <strong data-i18n="sourceScopeTitle">自由操作位值积木</strong>
          <p id="scopeText"></p>
        </div>
        <div class="manual-note" data-i18n="noRandom">数字由你输入，没有随机题目或固定范围。</div>
      </aside>

      <section class="learning-card">
        <div class="learning-heading">
          <div>
            <div class="eyebrow" data-i18n="handsOn">动手试试！</div>
            <h2 id="activityTitle">积木加法实验室</h2>
          </div>
          <div id="rangeBadge" class="range-badge" data-i18n="freeNumbers">自由数字</div>
        </div>

        <section class="hero-card">
          <div class="hero-kicker" data-i18n="currentOperation">现在操作</div>
          <div id="equation" class="equation" aria-live="polite">28 + 6 = ?</div>
          <p id="heroHint">积木已经摆好，直接拖动；需要进位时自己把十个合成一块。</p>
        </section>

        <section class="lab-panel">
          <div class="work-surface">
            <div class="block-workspace">
              <div id="additionBoard" class="operation-board addition-board">
                <section class="number-panel panel-a">
                  <header><span class="group-dot">A</span><strong data-i18n="groupA">第一组</strong><b id="valueA">28</b></header>
                  <div id="sourceAGrid" class="place-grid"></div>
                </section>
                <section class="number-panel panel-b">
                  <header><span class="group-dot">B</span><strong data-i18n="groupB">第二组</strong><b id="valueB">6</b></header>
                  <div id="sourceBGrid" class="place-grid"></div>
                </section>
                <section class="number-panel result-panel">
                  <header><span class="group-dot">=</span><strong data-i18n="combineArea">合并区</strong><b id="resultValue">?</b></header>
                  <div id="resultGrid" class="place-grid"></div>
                </section>
              </div>

              <div id="subtractionBoard" class="operation-board subtraction-board" hidden>
                <section class="number-panel panel-a wide-panel">
                  <header><span class="group-dot">A</span><strong data-i18n="startAmount">原有积木</strong><b id="subValueA">32</b></header>
                  <div id="minuendGrid" class="place-grid"></div>
                </section>
                <section class="number-panel removed-panel">
                  <header><span class="group-dot">−</span><strong data-i18n="takeAwayTray">减去区</strong><b id="removedProgress">0 / 9</b></header>
                  <div id="removedGrid" class="place-grid"></div>
                </section>
              </div>
              <div id="feedback" class="feedback" aria-live="polite"></div>
            </div>

            <aside class="working-card" aria-label="Vertical working">
              <div class="eyebrow" data-i18n="workingTitle">同步竖式</div>
              <div id="verticalFormula" class="vertical-formula" aria-live="polite"></div>
              <ol class="step-list" aria-label="Steps">
                <li data-step="1"><span class="step-number">1</span><div><strong data-i18n="stepMoveTitle">自己拖动</strong><p id="stepMoveText"></p></div></li>
                <li data-step="2"><span class="step-number">2</span><div><strong data-i18n="stepExchangeTitle">自己进位／借位</strong><p id="stepExchangeText"></p></div></li>
                <li data-step="3"><span class="step-number">3</span><div><strong data-i18n="stepFormulaTitle">从上往下看竖式</strong><p id="stepFormulaText"></p></div></li>
              </ol>
            </aside>
          </div>
        </section>

        <section class="block-key" aria-label="Block values">
          <div><img src="assets/one.png" alt="" /><span data-i18n="oneBlock">1 个位</span></div>
          <div><img src="assets/ten.png" alt="" /><span data-i18n="tenBlock">1 个十位 = 10 个个位</span></div>
          <div><img src="assets/hundred.png" alt="" /><span data-i18n="hundredBlock">1 个百位 = 10 个十位</span></div>
          <div><img src="assets/thousand.png" alt="" /><span data-i18n="thousandBlock">1 个千位 = 10 个百位</span></div>
        </section>
      </section>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
